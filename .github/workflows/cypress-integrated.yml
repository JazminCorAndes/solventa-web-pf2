name: Cypress · Integración real

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    name: Cypress con servicios y persistencia locales
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_REVISION: e78bf87c1983a9dc4463802a6c81a54bb4b3bfcd
      CYPRESS_DISPOSABLE_BACKEND: '1'
      CYPRESS_BACKEND_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Obtener revision del backend publico
        uses: actions/checkout@v6
        with:
          repository: Migue765/backend-solventa
          ref: ${{ env.BACKEND_REVISION }}
          path: .angular/cypress-backend
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Instalar servicios reales
        working-directory: .angular/cypress-backend
        run: |
          python -m pip install -r requirements-dev.txt
          for project in services/*/pyproject.toml; do
            python -m pip install -e "$(dirname "$project")"
          done
      - name: Arrancar entorno desechable y recorrer la aplicación
        run: |
          mkdir -p .angular/cypress
          (cd .angular/cypress-backend && exec python -m tests.jmeter.local_stack --web-port 5000 --mobile-port 5001 --encrypted-login) > .angular/cypress/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:5000/ping", timeout=1) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  time.sleep(0.25)
          else:
              raise SystemExit("El BFF local no arranco en 60s; no se omiten pruebas.")
          PY
          pnpm test:cypress:integrated
      - name: Conservar solo informes E2E
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cypress-integrated-results
          path: reports/cypress/integrated/*.xml
          if-no-files-found: warn
          retention-days: 14
