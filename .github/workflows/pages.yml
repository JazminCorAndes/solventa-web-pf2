name: GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar demo con mocks
        run: pnpm build:dev --base-href /solventa-web-pf2/

      - name: Preparar rutas de Angular
        run: |
          cp dist/solventa-web-pf2/browser/index.html dist/solventa-web-pf2/browser/404.html
          touch dist/solventa-web-pf2/browser/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publicar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/solventa-web-pf2/browser

  deploy:
    name: Desplegar demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
