name: Sincronizar release con develop

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:
    inputs:
      source_pr:
        description: 'PR de release ya integrado en master'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verified-backport-develop
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      vars.BACKPORT_AUTOMATION_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener automatización confiable de master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false

      - name: Crear token temporal de la App para este repositorio
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BACKPORT_APP_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Verificar e integrar la sincronización exacta
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          SOURCE_PR: ${{ inputs.source_pr || github.event.pull_request.number }}
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_SLUG: ${{ vars.BACKPORT_APP_SLUG }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { automaticBackport } = require('./.github/scripts/verified-backport.cjs');
            await automaticBackport({ github, context, core, sourceId: Number(process.env.SOURCE_PR),
              appId: Number(process.env.APP_ID), appSlug: process.env.APP_SLUG });
